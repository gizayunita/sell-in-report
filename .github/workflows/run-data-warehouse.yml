name: Run Data Warehouse

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-data-warehouse
  cancel-in-progress: false

jobs:
  run-data-warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install BigQuery client
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-cloud-bigquery google-auth

      - name: Authenticate and run SQL models
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GCP_PROJECT_ID: datawarehouse-490008
          BIGQUERY_LOCATION: asia-southeast2
        run: python data_warehouse/run_sql.py
